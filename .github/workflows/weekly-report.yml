name: Báo cáo tuần

on:
  schedule:
    # 01:23 UTC thứ Hai = 08:23 sáng thứ Hai giờ Việt Nam.
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/site-check.mjs report > report.md
      - name: Đăng báo cáo thành issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = require("fs").readFileSync("report.md", "utf8");
            const title = body.split("\n")[0].replace(/^#+\s*/, "");
            const { data: previous } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "bao-cao-tuan" });
            for (const issue of previous) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
            }
            await github.rest.issues.create({ ...context.repo, title, body, labels: ["bao-cao-tuan"] });
